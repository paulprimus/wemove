[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/config",
    "crates/server",
    "crates/web",
]


[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["WeMove Team"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
topcoat = { version = "0.9", features = ["router", "tower", "view", "tailwind"] }
turso = { version = "0.8.0-pre.13" }
bcrypt = "0.19.3"
jsonwebtoken = { version = "10", features = ["rust_crypto"], default-features = false }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
metrics = { version = "0.24", default-features = true }
metrics-exporter-prometheus = { version = "0.18", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "6"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }

[profile.release]
lto = true
codegen-units = 1
